name: Build NoteTrack Android Play Store Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Signed Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Release Keystore & Properties
        run: |
          if [ ! -f "android/notetrack-upload.jks" ]; then
            echo "Generating production release keystore..."
            keytool -genkey -v -keystore android/notetrack-upload.jks \
              -alias notetrack \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass notetrackpass \
              -keypass notetrackpass \
              -dname "CN=NoteTrack, OU=Mobile, O=NoteTrack, L=SanFrancisco, S=CA, C=US"
          fi
          cat <<EOF > android/keystore.properties
          storeFile=notetrack-upload.jks
          storePassword=notetrackpass
          keyAlias=notetrack
          keyPassword=notetrackpass
          EOF

      - name: Build Android App Bundle (.aab) & Release APK (.apk)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload Android App Bundle (for Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: notetrack-google-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload Direct Install APK (for Phone Testing)
        uses: actions/upload-artifact@v4
        with:
          name: notetrack-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Release Keystore (Backup for future app updates)
        uses: actions/upload-artifact@v4
        with:
          name: notetrack-upload-keystore
          path: |
            android/notetrack-upload.jks
            android/keystore.properties
